services:
  # Satu container WARP. Satu identitas, satu tunnel, satu IP.
  # Kalau tunnel tidak bisa dipakai, agent langsung register ulang.
  warp:
    build: .
    image: warp-pool:latest
    container_name: warp
    restart: unless-stopped
    ports:
      # SOCKS5 langsung (klien yang mendukung socks5://)
      - "127.0.0.1:25344:25344"
    volumes:
      - warp-data:/data
    environment:
      SOCKS_PORT: "25344"
      HEALTH_URL: "https://api.ipify.org"
      CHECK_INTERVAL: "60"
      COOLDOWN_SECONDS: "1800"
      # Probe kuota: POST 1 token ke model gratis. Halaman depan
      # opencode.ai selalu 200, jadi tidak bisa dipakai mendeteksi 429.
      QUOTA_ENABLED: "1"
      QUOTA_CHECK_INTERVAL: "300"
      QUOTA_MODEL: "deepseek-v4.1-flash-free"
      QUOTA_URL: "https://opencode.ai/inference/openai/v1/chat/completions"
      # 0 = jangan rotate saat 429 (limit ikut identitas, bukan IP)
      ROTATE_ON_429: "0"
      MIN_ROTATE_GAP: "120"
      REGISTER_RETRY_DELAY: "30"
      REGISTER_429_DELAY: "300"
      MAX_REGISTER_ATTEMPTS: "5"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh", "--quick"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Jembatan SOCKS5 -> HTTP untuk klien yang hanya menerima http://
  warp-http:
    build: ./privoxy
    image: warp-pool-privoxy:latest
    container_name: warp-http
    restart: unless-stopped
    environment:
      LISTEN_PORT: "8118"
      SOCKS_HOST: "warp"
      SOCKS_PORT: "25344"
      UPSTREAM_TIMEOUT: "120"
    depends_on:
      - warp
    ports:
      - "127.0.0.1:8118:8118"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  warp-data:
