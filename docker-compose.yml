services:
  warp-pool:
    build: .
    image: warp-pool:latest
    container_name: warp-pool
    restart: unless-stopped
    # SOCKS5 (25344-25346) untuk klien yang mendukung SOCKS,
    # HTTP (8118-8120) untuk klien yang hanya menerima http:// (9Router dll).
    # Semua bind ke 127.0.0.1 — akses dari luar lewat SSH tunnel.
    ports:
      - "127.0.0.1:25344:25344"
      - "127.0.0.1:25345:25345"
      - "127.0.0.1:25346:25346"
    volumes:
      - warp-pool-data:/data
    environment:
      POOL_SIZE: "3"
      BASE_PORT: "25344"
      CHECK_INTERVAL: "300"
      COOLDOWN_SECONDS: "1800"
      REGISTER_DELAY: "60"
      TARGET_URL: "https://opencode.ai"
      # opsional: notif Telegram kalau pool turun di bawah MIN_HEALTHY
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh", "--quick"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ─── HTTP front-ends ──────────────────────────────────────────────────
# Satu privoxy per slot. Dipisah per container (bukan network_mode
# sidecar) supaya tiap instance benar-benar independen: kalau digabung
# dalam satu netns, ketiganya berebut port 8118 dan berakhir memakai
# satu WARP slot yang sama (exit IP identik).

  warp-http-0:
    build: ./privoxy
    image: warp-pool-privoxy:latest
    container_name: warp-http-0
    restart: unless-stopped
    environment:
      LISTEN_PORT: "8118"
      SOCKS_HOST: "warp-pool"
      SOCKS_PORT: "25344"
    depends_on:
      - warp-pool
    ports:
      - "127.0.0.1:8118:8118"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  warp-http-1:
    build: ./privoxy
    image: warp-pool-privoxy:latest
    container_name: warp-http-1
    restart: unless-stopped
    environment:
      LISTEN_PORT: "8119"
      SOCKS_HOST: "warp-pool"
      SOCKS_PORT: "25345"
    depends_on:
      - warp-pool
    ports:
      - "127.0.0.1:8119:8119"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  warp-http-2:
    build: ./privoxy
    image: warp-pool-privoxy:latest
    container_name: warp-http-2
    restart: unless-stopped
    environment:
      LISTEN_PORT: "8120"
      SOCKS_HOST: "warp-pool"
      SOCKS_PORT: "25346"
    depends_on:
      - warp-pool
    ports:
      - "127.0.0.1:8120:8120"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  warp-pool-data:
