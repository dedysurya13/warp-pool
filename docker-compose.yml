services:
  # Satu container WARP. Satu identitas, satu tunnel, satu IP.
  # Kalau tunnel tidak bisa dipakai, agent langsung register ulang.
  warp:
    build: .
    image: warp-pool:latest
    container_name: warp
    restart: unless-stopped
    ports:
      # SOCKS5 langsung (klien yang mendukung socks5://)
      - "127.0.0.1:25344:25344"
      # HTTP lewat privoxy sidecar (9Router dll butuh http://)
      - "127.0.0.1:8118:8118"
    volumes:
      - warp-data:/data
    environment:
      SOCKS_PORT: "25344"
      HEALTH_URL: "https://api.ipify.org"
      TARGET_URL: "https://opencode.ai"
      CHECK_INTERVAL: "60"
      COOLDOWN_SECONDS: "1800"
      REGISTER_RETRY_DELAY: "30"
      MAX_REGISTER_ATTEMPTS: "5"
      # opsional: notif Telegram kalau tunnel gagal terus
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh", "--quick"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Jembatan SOCKS5 -> HTTP untuk klien yang hanya menerima http://
  warp-http:
    build: ./privoxy
    image: warp-pool-privoxy:latest
    container_name: warp-http
    restart: unless-stopped
    environment:
      LISTEN_PORT: "8118"
      SOCKS_HOST: "warp"
      SOCKS_PORT: "25344"
    depends_on:
      - warp
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  warp-data:
